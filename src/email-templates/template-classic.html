<!--
Title: Classic
Description: A traditional business email template with professional styling. Ideal for formal communications and corporate use.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #ffffff;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #ffffff;">
        <tr>
            <td align="center" style="padding: 30px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width: 600px; background-color: #ffffff; border: 1px solid #d1d5db;">
                    <!-- Header with colored bar -->
                    <tr>
                        <td style="background-color: #3b82f6; padding: 30px 40px; text-align: center;">
                            <h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #ffffff; font-family: Arial, sans-serif;">
                                {site_name}
                            </h1>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <div style="color: #1f2937; font-size: 15px; line-height: 1.7; font-family: Arial, sans-serif;">
                                {all_fields}
                            </div>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 25px 40px; background-color: #f9fafb; border-top: 2px solid #8b5cf6;">
                            <p style="margin: 0 0 10px 0; font-size: 13px; color: #4b5563; font-family: Arial, sans-serif;">
                                <strong style="color: #3b82f6;">{site_name}</strong>
                            </p>
                            <p style="margin: 0; font-size: 12px; color: #6b7280; font-family: Arial, sans-serif;">
                                This email was sent on {date} at {time}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
