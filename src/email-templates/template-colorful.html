<!--
Title: Colorful
Description: A vibrant, eye-catching email template with bold colors. Great for marketing emails and creative communications.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f0f0f0;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f0f0f0;">
        <tr>
            <td align="center" style="padding: 30px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <!-- Colorful Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); padding: 50px 40px; text-align: center;">
                            <h1 style="margin: 0; font-size: 32px; font-weight: 700; color: #ffffff; font-family: Arial, sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">
                                {site_name}
                            </h1>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 50px 40px; background-color: #ffffff;">
                            <div style="color: #1f2937; font-size: 16px; line-height: 1.8; font-family: Arial, sans-serif;">
                                {content}
                            </div>
                        </td>
                    </tr>
                    <!-- Colorful Footer -->
                    <tr>
                        <td style="padding: 30px 40px; background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); text-align: center;">
                            <p style="margin: 0; font-size: 14px; color: #ffffff; font-family: Arial, sans-serif; font-weight: 500;">
                                {site_name}
                            </p>
                            <p style="margin: 10px 0 0 0; font-size: 12px; color: rgba(255,255,255,0.9); font-family: Arial, sans-serif;">
                                © {date} All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
